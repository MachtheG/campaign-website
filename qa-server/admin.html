<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Campaign Q&A</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',sans-serif;background:#0a0f1e;color:#f0ece4;min-height:100vh}
        .login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
        .login-box{background:#111827;border:1px solid rgba(201,160,61,0.2);border-radius:16px;padding:2.5rem;max-width:400px;width:100%;text-align:center}
        .login-box h1{color:#c9a03d;font-size:1.8rem;margin-bottom:0.5rem}
        .login-box p{color:#a0a8b8;margin-bottom:1.5rem;font-size:0.9rem}
        .login-box input{width:100%;padding:12px 16px;background:#0a0f1e;border:1px solid rgba(201,160,61,0.2);border-radius:8px;color:#f0ece4;font-size:1.1rem;text-align:center;letter-spacing:8px;margin-bottom:1rem}
        .login-box input:focus{outline:none;border-color:#c9a03d}
        .login-box button{width:100%;padding:12px;background:linear-gradient(135deg,#c9a03d,#a07828);color:#0a0f1e;border:none;border-radius:50px;font-weight:700;font-size:1rem;cursor:pointer}
        .login-box .error{color:#ef4444;font-size:0.85rem;margin-top:0.5rem;display:none}
        .admin-panel{display:none;max-width:900px;margin:0 auto;padding:20px}
        .admin-header{display:flex;justify-content:space-between;align-items:center;padding:1.5rem 0;border-bottom:1px solid rgba(201,160,61,0.2);margin-bottom:1.5rem;flex-wrap:wrap;gap:1rem}
        .admin-header h1{color:#c9a03d;font-size:1.5rem}
        .tabs{display:flex;gap:0.5rem;margin-bottom:1.5rem;flex-wrap:wrap}
        .tab{padding:8px 18px;border-radius:50px;border:1px solid rgba(201,160,61,0.2);background:transparent;color:#a0a8b8;cursor:pointer;font-size:0.85rem;transition:all 0.2s}
        .tab.active,.tab:hover{background:#c9a03d;color:#0a0f1e;border-color:#c9a03d}
        .q-card{background:#111827;border:1px solid rgba(201,160,61,0.1);border-radius:12px;padding:1.2rem;margin-bottom:1rem;border-left:3px solid #c9a03d}
        .q-card.answered{border-left-color:#22c47a}
        .q-card.flagged{border-left-color:#ef4444;background:rgba(239,68,68,0.05)}
        .q-meta{display:flex;justify-content:space-between;margin-bottom:0.5rem;flex-wrap:wrap;gap:0.3rem}
        .q-name{color:#c9a03d;font-weight:600}
        .q-time{color:#6b7280;font-size:0.8rem}
        .q-text{color:#a0a8b8;margin-bottom:0.8rem;line-height:1.6}
        .q-answer-box{background:rgba(34,196,122,0.08);border:1px solid rgba(34,196,122,0.2);padding:0.8rem;border-radius:8px;margin-bottom:0.8rem}
        .q-answer-box strong{color:#22c47a}
        .q-answer-box div{color:#a0a8b8;margin-top:0.3rem}
        .q-actions{display:flex;gap:0.5rem;flex-wrap:wrap}
        .q-actions button{padding:6px 14px;border-radius:50px;border:none;cursor:pointer;font-size:0.8rem;font-weight:600;transition:all 0.2s}
        .btn-answer{background:#1a6b4a;color:white}
        .btn-delete{background:#7f1d1d;color:white}
        .btn-flag{background:#78350f;color:white}
        .btn-logout{background:transparent;border:1px solid rgba(201,160,61,0.3);color:#c9a03d;padding:8px 18px;border-radius:50px;cursor:pointer;font-size:0.85rem}
        textarea{width:100%;padding:10px;background:#0a0f1e;border:1px solid rgba(201,160,61,0.2);border-radius:8px;color:#f0ece4;font-family:inherit;resize:vertical;margin-bottom:0.5rem}
        textarea:focus{outline:none;border-color:#c9a03d}
        .badge{display:inline-block;padding:3px 10px;border-radius:50px;font-size:0.7rem;font-weight:600;margin-left:0.5rem}
        .badge-green{background:rgba(34,196,122,0.15);color:#22c47a}
        .badge-orange{background:rgba(251,146,60,0.15);color:#fb923c}
        .badge-red{background:rgba(239,68,68,0.15);color:#ef4444}
        .stats-row{display:flex;gap:1rem;margin-bottom:1.5rem;flex-wrap:wrap}
        .stat-box{flex:1;min-width:120px;background:#111827;border:1px solid rgba(201,160,61,0.1);border-radius:12px;padding:1rem;text-align:center}
        .stat-box .num{font-size:2rem;font-weight:700;color:#c9a03d}
        .stat-box .label{color:#6b7280;font-size:0.8rem;margin-top:0.3rem}
        .empty{text-align:center;padding:3rem;color:#6b7280}
    </style>
</head>
<body>
    <div class="login-screen" id="loginScreen">
        <div class="login-box">
            <h1>🔐 Admin Panel</h1>
            <p>Enter your PIN to access the campaign management dashboard</p>
            <input type="password" id="pinInput" placeholder="••••" maxlength="10" autofocus>
            <button onclick="login()">Verify PIN</button>
            <div class="error" id="loginError">Invalid PIN. Please try again.</div>
        </div>
    </div>

    <div class="admin-panel" id="adminPanel">
        <div class="admin-header">
            <h1>🗳️ Campaign Admin</h1>
            <button class="btn-logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>
        <div class="stats-row" id="statsRow"></div>
        <div class="tabs">
            <button class="tab active" data-filter="all">All</button>
            <button class="tab" data-filter="pending">⏳ Pending</button>
            <button class="tab" data-filter="answered">✅ Answered</button>
            <button class="tab" data-filter="flagged">🚩 Flagged</button>
        </div>
        <div id="questions"></div>
    </div>

    <script>
    const API=window.location.origin+'/api';
    let token=localStorage.getItem('adminToken'),filter='all';

    async function login(){
        const pin=document.getElementById('pinInput').value;
        try{
            const r=await fetch(API+'/admin/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin})});
            const d=await r.json();
            if(d.success){token=d.token;localStorage.setItem('adminToken',token);showAdmin();}
            else{document.getElementById('loginError').style.display='block';}
        }catch(e){document.getElementById('loginError').textContent='Server error';document.getElementById('loginError').style.display='block';}
    }
    document.getElementById('pinInput').addEventListener('keypress',e=>{if(e.key==='Enter')login();});

    function logout(){localStorage.removeItem('adminToken');token=null;document.getElementById('adminPanel').style.display='none';document.getElementById('loginScreen').style.display='flex';}

    function showAdmin(){document.getElementById('loginScreen').style.display='none';document.getElementById('adminPanel').style.display='block';loadQuestions();}

    function esc(t){if(!t)return'';const d=document.createElement('div');d.textContent=t;return d.innerHTML;}

    async function loadQuestions(){
        try{
            const r=await fetch(API+'/questions');const d=await r.json();
            const answered=d.questions.filter(q=>q.answered).length;
            const flagged=d.questions.filter(q=>q.flagged).length;
            document.getElementById('statsRow').innerHTML=`
                <div class="stat-box"><div class="num">${d.total}</div><div class="label">Total</div></div>
                <div class="stat-box"><div class="num">${d.total-answered}</div><div class="label">Pending</div></div>
                <div class="stat-box"><div class="num">${answered}</div><div class="label">Answered</div></div>
                <div class="stat-box"><div class="num">${flagged}</div><div class="label">Flagged</div></div>`;
            let qs=d.questions;
            if(filter==='pending')qs=qs.filter(q=>!q.answered);
            if(filter==='answered')qs=qs.filter(q=>q.answered);
            if(filter==='flagged')qs=qs.filter(q=>q.flagged);
            const c=document.getElementById('questions');
            if(!qs.length){c.innerHTML='<div class="empty">No questions in this category</div>';return;}
            c.innerHTML=qs.map(q=>`
                <div class="q-card ${q.answered?'answered':''} ${q.flagged?'flagged':''}">
                    <div class="q-meta">
                        <span><span class="q-name">${esc(q.name)}</span>
                        ${q.answered?'<span class="badge badge-green">Answered</span>':'<span class="badge badge-orange">Pending</span>'}
                        ${q.flagged?'<span class="badge badge-red">Flagged</span>':''}</span>
                        <span class="q-time">${new Date(q.timestamp).toLocaleString()} · 👍 ${q.votes||0}</span>
                    </div>
                    <div class="q-text">${esc(q.question)}</div>
                    ${q.answered?`<div class="q-answer-box"><strong>✅ Response:</strong><div>${esc(q.answer)}</div></div>`:`<textarea id="ans-${q.id}" rows="3" placeholder="Type Maureen's response..."></textarea>`}
                    <div class="q-actions">
                        ${!q.answered?`<button class="btn-answer" onclick="answer(${q.id})"><i class="fas fa-reply"></i> Answer</button>`:''}
                        <button class="btn-flag" onclick="flagQ(${q.id})">${q.flagged?'Unflag':'🚩 Flag'}</button>
                        <button class="btn-delete" onclick="deleteQ(${q.id})"><i class="fas fa-trash"></i> Delete</button>
                    </div>
                </div>`).join('');
        }catch(e){document.getElementById('questions').innerHTML='<div class="empty">⚠️ Cannot connect to server</div>';}
    }

    async function answer(id){
        const a=document.getElementById('ans-'+id);if(!a||!a.value.trim())return;
        await fetch(API+'/questions/'+id+'/answer',{method:'POST',headers:{'Content-Type':'application/json','x-admin-token':token},body:JSON.stringify({answer:a.value})});
        loadQuestions();
    }
    async function deleteQ(id){
        if(!confirm('Delete this question permanently?'))return;
        await fetch(API+'/questions/'+id,{method:'DELETE',headers:{'x-admin-token':token}});
        loadQuestions();
    }
    async function flagQ(id){
        await fetch(API+'/questions/'+id+'/flag',{method:'POST',headers:{'Content-Type':'application/json','x-admin-token':token}});
        loadQuestions();
    }

    document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
        document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');
        filter=t.dataset.filter;loadQuestions();
    }));

    if(token){showAdmin();}
    setInterval(()=>{if(token)loadQuestions();},8000);
    </script>
</body>
</html>
