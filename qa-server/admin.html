<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel</title>
  <script>
    // The moderation portal now lives at the site root (/admin.html) so it can be
    // deployed with the static site (KickHost) and still talk to the API via config.js.
    // Preserve any ?role= query when redirecting.
    window.location.replace('/admin.html' + (window.location.search || ''));
  </script>
</head>
<body>
  <p>Redirecting to the moderation portal&hellip; If you are not redirected, <a href="/admin.html">click here</a>.</p>
</body>
</html>
